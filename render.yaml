services:
  - type: web
    name: redas-studio
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # paste your existing Render PostgreSQL "Internal Database URL" here
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false   # set your admin panel password here
