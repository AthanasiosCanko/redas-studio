services:
  - type: web
    name: redas-studio
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: redas-studio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false   # set manually in Render dashboard

databases:
  - name: redas-studio-db
    plan: free
    databaseName: redas_studio
