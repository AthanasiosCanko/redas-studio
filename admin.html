<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paneli — R-EDA'S STUDIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest-admin.json">
  <meta name="theme-color" content="#5c2520">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="R-EDA'S Admin">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="booking.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <!-- ─── LOGIN ─────────────────────────────────────────── -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <p class="login-brand">R&#x2011;EDA'S STUDIO</p>
      <h1 class="login-title"><em>Hyrje</em> në panel</h1>
      <form id="login-form" class="login-form" novalidate>
        <label class="bk-label">
          Fjalëkalimi
          <input id="login-pw" class="bk-input" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="login-error" hidden>Fjalëkalim i gabuar — provoni përsëri.</p>
        <button class="bk-submit" type="submit">Hyr</button>
      </form>
    </div>
  </div>

  <!-- ─── DASHBOARD ────────────────────────────────────── -->
  <div id="dashboard" hidden>

    <header class="adm-header">
      <span class="adm-header-brand">
        R&#x2011;EDA'S STUDIO
        <span class="adm-header-tag">Admin</span>
      </span>
      <div class="adm-header-actions">
        <a href="index.html" class="adm-link">Shiko faqen</a>
        <button id="logout-btn" class="adm-link adm-link--btn">Dil</button>
      </div>
    </header>

    <nav class="adm-tabs">
      <button class="adm-tab adm-tab--active" data-tab="bookings">Rezervimet</button>
      <button class="adm-tab" data-tab="availability">Disponueshmëria</button>
    </nav>

    <!-- ── BOOKINGS TAB ─────────────────────────────────── -->
    <section id="tab-bookings" class="adm-section">
      <div class="adm-inner">
        <div class="adm-filter-row">
          <button class="adm-filter adm-filter--active" data-filter="requests">Kërkesat</button>
          <button class="adm-filter" data-filter="upcoming">Të ardhshme</button>
          <button class="adm-filter" data-filter="past">Të kaluara</button>
          <button class="adm-filter" data-filter="all">Të gjitha</button>
        </div>
        <div id="bookings-list"></div>
      </div>
    </section>

    <!-- ── AVAILABILITY TAB ─────────────────────────────── -->
    <section id="tab-availability" class="adm-section" hidden>
      <div class="adm-inner">

        <p class="adm-section-hint">Klikoni një ditë për të parë rezervimet, për të shtuar një ose për ta bllokuar.</p>

        <div class="cal-wrap adm-cal-wrap">
          <div class="cal-nav">
            <button class="cal-nav-btn" id="adm-cal-prev" aria-label="Muaji i kaluar">&#8592;</button>
            <span class="cal-month-label" id="adm-cal-month"></span>
            <button class="cal-nav-btn" id="adm-cal-next" aria-label="Muaji tjetër">&#8594;</button>
          </div>
          <div class="cal-grid" id="adm-cal-grid">
            <span class="cal-day-name">Die</span>
            <span class="cal-day-name">Hën</span>
            <span class="cal-day-name">Mar</span>
            <span class="cal-day-name">Mër</span>
            <span class="cal-day-name">Enj</span>
            <span class="cal-day-name">Pre</span>
            <span class="cal-day-name">Sht</span>
          </div>
        </div>

        <div id="day-panel" class="day-panel" hidden>
          <div class="day-panel-header">
            <h3 class="day-panel-title" id="day-panel-title"></h3>
            <button class="adm-block-day-btn" id="adm-block-day-btn"></button>
          </div>
          <div id="day-panel-bookings" class="day-panel-bookings"></div>
          <button class="bk-submit adm-add-booking-btn" id="adm-add-booking" type="button">Shto rezervim</button>
        </div>

      </div>
    </section>

  </div>

  <!-- ─── ADMIN BOOKING MODAL ──────────────────────────── -->
  <div class="bk-overlay" id="adm-bk-overlay" hidden>
    <div class="bk-modal" role="dialog" aria-modal="true" aria-labelledby="adm-bk-title">
      <button class="bk-close" id="adm-bk-close" aria-label="Mbyll">&times;</button>
      <h3 class="bk-modal-title" id="adm-bk-title">Rezervim i ri</h3>
      <p class="bk-modal-sub" id="adm-bk-sub"></p>
      <form class="bk-form" id="adm-bk-form" novalidate>
        <p class="time-pick-hint">Orari — 9:00 – 20:00</p>
        <div id="adm-time-picker"></div>
        <p class="slot-warning" id="adm-bk-warning" hidden></p>
        <label class="bk-label">
          Emri i klientit
          <input class="bk-input" id="adm-bk-name" type="text" placeholder="p.sh. Eda Hasani" required autocomplete="off">
        </label>
        <label class="bk-label">
          <span>Email <span class="bk-optional">(opsionale)</span></span>
          <input class="bk-input" id="adm-bk-email" type="email" placeholder="ju@mail.com" autocomplete="off">
        </label>
        <label class="bk-label">
          <span>Numri i telefonit <span class="bk-optional">(opsionale)</span></span>
          <span class="bk-phone-field">
            <span class="bk-phone-prefix">+355</span>
            <input class="bk-input" id="adm-bk-phone" type="tel" inputmode="numeric" placeholder="69 123 4567" autocomplete="off">
          </span>
        </label>
        <button class="bk-submit" type="submit">Konfirmo rezervimin</button>
      </form>
      <div class="bk-success" id="adm-bk-success" hidden>
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 20.5l5.5 5.5 10-11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>Rezervimi u konfirmua.</p>
      </div>
    </div>
  </div>

  <script src="timepicker.js"></script>
  <script src="admin.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
